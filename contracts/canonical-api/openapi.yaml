components:
  schemas:
    TaskPilotProblemDetails:
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
        correlationId:
          type: string
        path:
          type: string
        retryAfterSeconds:
          type: integer
          format: int64
    ReorderColumnsRequest:
      type: object
      properties:
        expectedBoardVersion:
          type: integer
          format: int64
        columnIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - expectedBoardVersion
      - columnIds
    BoardColumnView:
      type: object
      properties:
        columnId:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          format: int64
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cards:
          type: array
          items:
            $ref: '#/components/schemas/CardView'
      required:
      - columnId
      - name
      - position
      - version
      - createdAt
      - updatedAt
      - cards
    BoardView:
      type: object
      properties:
        boardId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        columns:
          type: array
          items:
            $ref: '#/components/schemas/BoardColumnView'
      required:
      - boardId
      - projectId
      - name
      - description
      - version
      - createdAt
      - updatedAt
      - columns
    CardView:
      type: object
      properties:
        workItemId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        workItemVersion:
          type: integer
          format: int64
        placementVersion:
          type: integer
          format: int64
        position:
          type: integer
          format: int64
        assignee:
          $ref: '#/components/schemas/AssigneeTarget'
          nullable: true
      required:
      - workItemId
      - title
      - description
      - workItemVersion
      - placementVersion
      - position
    PersonSummary:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type:
          - string
          - 'null'
      required:
      - userId
      - displayName
      - avatarUrl
    ProjectMemberSummary:
      type: object
      properties:
        projectMemberId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/PersonSummary'
        role:
          type: string
