openapi: 3.1.0
info:
  title: TaskPilot Canonical Resource API
  version: 0.1.0
paths:
  /v1/boards/{boardId}/column-order:
    put:
      tags:
      - Project work
      description: Requires an access bearer credential from an active opaque session.
      operationId: reorderColumns
      parameters:
      - name: boardId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderColumnsRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardView'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '404':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '409':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
  /v1/workspaces/{workspaceId}/projects:
    get:
      tags:
      - Project
      description: Lists ACTIVE or ARCHIVED Projects in the path-scoped Workspace using deterministic ordering, a bounded
        limit, and an opaque cursor. Requires Workspace OWNER access.
      operationId: list
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: ACTIVE
          enum:
          - ACTIVE
          - ARCHIVED
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '404':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
    post:
      tags:
      - Project
      description: Creates a Project in the path-scoped Workspace. Requires Workspace OWNER access. requestId is idempotent
        for the authenticated User and Workspace; duplicate Project names are allowed.
      operationId: create
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '404':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '409':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
  /v1/session:refresh:
    post:
      tags:
      - Session
      description: Requires a refresh credential from an active opaque session in the request body; successful refresh rotates
        both tokens.
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security: []
      x-taskpilot-authentication: refresh-credential-body
      x-taskpilot-ingress: canonical
  /v1/session:logout:
    post:
      tags:
      - Session
      description: Requires an access bearer credential from an active opaque session.
      operationId: logout
      responses:
        '204':
          description: Success
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
  /v1/projects/{projectId}:restore:
    post:
      tags:
      - Project
      description: Restores the path-scoped Project as its Project OWNER using expectedVersion.
      operationId: restore
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '404':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '409':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
  /v1/projects/{projectId}:permanentlyDelete:
    post:
      tags:
      - Project
      description: Permanently and irreversibly deletes the path-scoped Project as its Project OWNER. confirmationName must
        exactly match the current name, expectedVersion rejects concurrent changes, and protected dependencies reject deletion.
      operationId: permanentlyDelete
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProjectRequest'
        required: true
      responses:
        '204':
          description: Success
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '404':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '409':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
  /v1/projects/{projectId}:archive:
    post:
      tags:
      - Project
      description: Archives the path-scoped Project as its Project OWNER using expectedVersion.
      operationId: archive
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '404':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '409':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
  /v1/projects/{projectId}/members:
    get:
      tags:
      - Project work
      description: Lists active Project Members eligible for current Work Item assignment in deterministic displayName and membership id order.
      operationId: listProjectMembers
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberList'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '404':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
  /v1/projects/{projectId}/boards:
    get:
      tags:
      - Project work
      description: Lists Project-scoped Boards as the Project OWNER in deterministic createdAt and boardId order.
      operationId: listBoards
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardSummary'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '404':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
    post:
      tags:
      - Project work
      description: Creates a Project-scoped Board and its localized initial Column atomically as the Project OWNER. requestId
        is idempotent within actor and Project scope.
      operationId: createBoard
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardRequest'
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardView'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '404':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '409':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
  /v1/federated-registrations:
    post:
      tags:
      - Federated authentication
      description: Desktop Main privately owns and submits the registration continuation; Renderer must not receive it. Successful
        registration returns an immediately active opaque session.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederatedRegistrationRequest'
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederatedPollResponse'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '409':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security: []
      x-taskpilot-authentication: anonymous
      x-taskpilot-ingress: canonical
  /v1/federated-login-attempts:
    post:
      tags:
      - Federated authentication
      operationId: createAttempt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederatedAttemptRequest'
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederatedAttemptResponse'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '429':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security: []
      x-taskpilot-authentication: anonymous
      x-taskpilot-ingress: canonical
  /v1/federated-login-attempts/{attemptId}:poll:
    post:
      tags:
      - Federated authentication
      description: Desktop Main supplies its poll secret in the body. The browser completion proof is optional while reading
        a pending status and is required before identity resolution. A known External Identity returns an active opaque session;
        a new identity returns a private registration continuation.
      operationId: poll
      parameters:
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederatedPollRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederatedPollResponse'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '409':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '410':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security: []
      x-taskpilot-authentication: anonymous
      x-taskpilot-ingress: canonical
  /v1/federated-login-attempts/{attemptId}:cancel:
    post:
      tags:
      - Federated authentication
      operationId: cancel
      parameters:
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederatedAttemptSecretRequest'
        required: true
      responses:
        '204':
          description: Success
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '409':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security: []
      x-taskpilot-authentication: anonymous
      x-taskpilot-ingress: canonical
  /v1/boards/{boardId}:permanentlyDelete:
    post:
      tags:
      - Project work
      description: Permanently and irreversibly deletes an empty Board as its Project OWNER. expectedVersion rejects concurrent
        changes, confirmationName must exactly match the current name, Work Items are preserved, and protected dependencies
        reject deletion.
      operationId: permanentlyDeleteBoard
      parameters:
      - name: boardId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteBoardRequest'
        required: true
      responses:
        '204':
          description: Success
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '404':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '409':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
  /v1/boards/{boardId}/work-items:
    post:
      tags:
      - Project work
      description: Creates a Work Item and its first Placement atomically as the Project OWNER. requestId and expectedBoardVersion
        participate in the idempotency contract.
      operationId: createWorkItem
      parameters:
      - name: boardId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkItemRequest'
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkItemResult'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '404':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '409':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
  /v1/boards/{boardId}/placements/{workItemId}:move:
    post:
      tags:
      - Project work
      description: Moves the Work Item Card using Board and Placement expected versions and returns the authoritative Board
        without changing canonical Work Item content or other Board placements.
      operationId: movePlacement
      parameters:
      - name: boardId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: workItemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovePlacementRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardView'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '404':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '409':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '503':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
      security:
      - accessBearer: []
      x-taskpilot-authentication: access-bearer
      x-taskpilot-ingress: canonical
  /v1/boards/{boardId}/columns:
    post:
      tags:
      - Project work
      description: Requires an access bearer credential from an active opaque session.
      operationId: createColumn
      parameters:
      - name: boardId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColumnRequest'
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardView'
        '400':
          description: Request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TaskPilotProblemDetails'
        '401':
