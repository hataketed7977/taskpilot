          type:
          - boolean
          - 'null'
        legalBundleVersion:
          type: string
          maxLength: 128
          minLength: 0
        termsVersion:
          type: string
          maxLength: 128
          minLength: 0
        privacyVersion:
          type: string
          maxLength: 128
          minLength: 0
        locale:
          type: string
          maxLength: 35
          minLength: 0
      required:
      - continuationId
      - continuationSecret
      - displayName
      - useSuggestedAvatar
      - legalBundleVersion
      - termsVersion
      - privacyVersion
      - locale
    FederatedBootstrapResponse:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
      required:
      - workspaceId
      - projectId
    FederatedPollResponse:
      type: object
      properties:
        status:
          type: string
        registration:
          oneOf:
          - $ref: '#/components/schemas/RegistrationPreviewResponse'
          - type: 'null'
        session:
          oneOf:
          - $ref: '#/components/schemas/SessionResponse'
          - type: 'null'
        bootstrap:
          oneOf:
          - $ref: '#/components/schemas/FederatedBootstrapResponse'
          - type: 'null'
      required:
      - status
    RegistrationPreviewResponse:
      type: object
      properties:
        continuationId:
          type: string
          format: uuid
        continuationSecret:
          type: string
        suggestedDisplayName:
          type: string
        suggestedAvatarUrl:
          type:
          - string
          - 'null'
          format: uri
        legalBundleVersion:
          type: string
        termsVersion:
          type: string
        privacyVersion:
          type: string
        legalLocales:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - continuationId
      - continuationSecret
      - suggestedDisplayName
      - legalBundleVersion
      - termsVersion
      - privacyVersion
      - legalLocales
      - expiresAt
    FederatedAttemptRequest:
      type: object
      properties:
        provider:
          type: string
          enum:
          - github
        installationId:
          type: string
          maxLength: 200
          minLength: 0
          pattern: ^[A-Za-z0-9_.:-]+$
        completionUri:
          type: string
          maxLength: 2048
          minLength: 0
          pattern: ^http://127\.0\.0\.1:(?:49(?:15[2-9]|1[6-9][0-9]|[2-9][0-9]{2})|5[0-9]{4}|6(?:[0-4][0-9]{3}|5(?:[0-4][0-9]{2}|5(?:[0-2][0-9]|3[0-5]))))/taskpilot/oauth/complete/[A-Za-z0-9_-]{32,128}$
      required:
      - completionUri
      - installationId
      - provider
    FederatedAttemptResponse:
      type: object
      properties:
        attemptId:
          type: string
          format: uuid
        pollSecret:
          type: string
