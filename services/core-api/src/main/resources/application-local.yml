server:
  address: 127.0.0.1
  port: ${TASKPILOT_CORE_API_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:${TASKPILOT_POSTGRES_PORT:5432}/taskpilot
    username: taskpilot
    password: ${TASKPILOT_POSTGRES_PASSWORD}
  flyway:
    enabled: true
  data:
    redis:
      host: 127.0.0.1
      port: ${TASKPILOT_REDIS_PORT:6379}
      password: ${TASKPILOT_REDIS_PASSWORD}
      timeout: 2s

taskpilot:
  authentication:
    enabled: true
    token-pepper-base64: ${TASKPILOT_AUTH_TOKEN_PEPPER_BASE64}
    legal-bundle-version: "2026-09-01"
    terms-version: "terms-2026-09-01"
    privacy-version: "privacy-2026-09-01"
    legal-locales: ${TASKPILOT_AUTH_LEGAL_LOCALES:zh-CN,en}
    github:
      client-id: ${TASKPILOT_GITHUB_CLIENT_ID:}
      client-secret: ${TASKPILOT_GITHUB_CLIENT_SECRET:}
      callback-uri: ${TASKPILOT_GITHUB_CALLBACK_URI:}
      hmac-key-base64: ${TASKPILOT_FEDERATED_HMAC_KEY_BASE64:}
      aead-key-base64: ${TASKPILOT_FEDERATED_AEAD_KEY_BASE64:}
