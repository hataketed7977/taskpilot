server:
  address: 127.0.0.1
  port: ${TASKPILOT_CORE_API_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:${TASKPILOT_POSTGRES_PORT:5432}/taskpilot
    username: taskpilot
    password: ${TASKPILOT_POSTGRES_PASSWORD}
  flyway:
    enabled: true
  mail:
    host: ${TASKPILOT_VERIFICATION_SMTP_HOST:127.0.0.1}
    port: ${TASKPILOT_VERIFICATION_SMTP_PORT:${TASKPILOT_SMTP_PORT:1025}}
    username: ${TASKPILOT_VERIFICATION_SMTP_USERNAME:}
    password: ${TASKPILOT_VERIFICATION_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${TASKPILOT_VERIFICATION_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${TASKPILOT_VERIFICATION_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${TASKPILOT_VERIFICATION_SMTP_STARTTLS:false}
      mail.smtp.ssl.enable: ${TASKPILOT_VERIFICATION_SMTP_SSL:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

taskpilot:
  authentication:
    enabled: true
    token-pepper-base64: ${TASKPILOT_AUTH_TOKEN_PEPPER_BASE64}
    recovery-key-base64: ${TASKPILOT_AUTH_RECOVERY_KEY_BASE64}
    terms-version: "2026-09-01"
  verification:
    enabled: true
    pepper-base64: ${TASKPILOT_VERIFICATION_PEPPER_BASE64}
    request-maximum-attempts: 100
    mail-adapter: ${TASKPILOT_VERIFICATION_MAIL_ADAPTER:local}
    smtp:
      from: ${TASKPILOT_VERIFICATION_SMTP_FROM:no-reply@taskpilot.local}
