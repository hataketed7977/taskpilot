spring:
  application:
    name: taskpilot-core-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      enabled: false
  flyway:
    enabled: false
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: ${TASKPILOT_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${TASKPILOT_SWAGGER_UI_ENABLED:true}
    persist-authorization: false
