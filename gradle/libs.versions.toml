[versions]
java = "21"
kotlin = "2.3.21"
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
spring-modulith = "2.1.1"
archunit = "1.5.1"
junit = "6.0.3"
testcontainers = "2.0.5"
detekt = "1.23.8"
detekt-kotlin = "2.0.21"
ktlint-plugin = "14.2.0"
ktlint-engine = "1.8.0"
kover = "0.9.10"
icu4j = "78.3"
bouncycastle = "1.86"
springdoc = "3.1.1"

[libraries]
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
postgresql = { module = "org.postgresql:postgresql", version = "42.7.13" }
flyway-core = { module = "org.flywaydb:flyway-core", version = "12.4.0" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version = "12.4.0" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
