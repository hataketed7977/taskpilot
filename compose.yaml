name: taskpilot-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskpilot
      POSTGRES_USER: taskpilot
      POSTGRES_PASSWORD: ${TASKPILOT_POSTGRES_PASSWORD:?Run pnpm dev:setup to create .env.local}
    ports:
      - "127.0.0.1:${TASKPILOT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - taskpilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpilot -d taskpilot"]
      interval: 2s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TASKPILOT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${TASKPILOT_MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  taskpilot-postgres-data:
