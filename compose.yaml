name: ${TASKPILOT_COMPOSE_PROJECT}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskpilot
      POSTGRES_USER: taskpilot
      POSTGRES_PASSWORD: ${TASKPILOT_POSTGRES_PASSWORD:?Run pnpm bootstrap to create .env.local}
    ports:
      - "127.0.0.1:${TASKPILOT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - taskpilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpilot -d taskpilot"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${TASKPILOT_REDIS_PASSWORD:?Run pnpm bootstrap to create .env.local}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${TASKPILOT_REDIS_PASSWORD:?Run pnpm bootstrap to create .env.local}"]
    ports:
      - "127.0.0.1:${TASKPILOT_REDIS_PORT:-6379}:6379"
    volumes:
      - taskpilot-redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  taskpilot-postgres-data:
  taskpilot-redis-data:
